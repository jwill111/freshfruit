<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Fruit, Broken Bodies: a field notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#E9DFCB;color:#24211C;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:18px;line-height:1.55}
html{scroll-behavior:smooth}
a{color:#B3263E}
.slab,h1,h2,h3,h4{font-family:'Zilla Slab',Rockwell,Georgia,serif;font-weight:700;letter-spacing:-0.01em}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:0.04em}
.hand{font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #2E5A87;outline-offset:3px}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1320px;margin:0 auto}
.side{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:28px 0 28px 20px;box-sizing:border-box}
.tabs{display:flex;flex-direction:column;gap:6px}
.main{padding:28px 24px 64px;display:flex;flex-direction:column;gap:36px;min-width:0}
.sheet{position:relative;background-color:#FBF7EE;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#D8E2EA 33px,#D8E2EA 34px);border-radius:6px;box-shadow:0 1px 0 #CDBFA4,0 10px 24px rgba(60,40,10,0.10);padding:48px 44px 48px 92px;scroll-margin-top:16px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:64px;width:2px;background:#E7A3A3}
.card{position:relative;background:#FFFFFF;border:1.5px solid #CDBFA4;border-radius:4px;padding:22px 24px;box-shadow:0 2px 0 #E2D6BE}
.tape::after{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(232,214,160,0.75);transform:rotate(-2deg);border-left:1px dashed rgba(0,0,0,0.08);border-right:1px dashed rgba(0,0,0,0.08)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:22px;align-items:start}
.mapbox{position:relative;width:100%;aspect-ratio:4/3;background:#F3EAD6;border:1.5px solid #CDBFA4;border-radius:4px;overflow:hidden}
@media (max-width:900px){
.shell{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:0;z-index:20;height:auto;padding:10px 16px;background:#E9DFCB;border-bottom:1.5px solid #CDBFA4;overflow-x:auto;overflow-y:hidden}
.tabs{flex-direction:row;gap:6px}
.sidehead{display:none}
.main{padding:20px 12px 48px}
.sheet{padding:32px 18px 32px 40px}
.sheet::before{left:24px}
.split{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="shell">
<aside class="side" aria-label="Sections">
<div class="sidehead" style="padding:0 14px 18px 4px">
<div class="mono" style="font-size:12px;text-transform:uppercase;color:#7A5230">Field notebook</div>
<div class="slab" style="font-size:24px;line-height:1.1;margin-top:6px">Fresh Fruit, Broken Bodies</div>
<div style="height:6px;background:#D8CDB4;border-radius:3px;margin-top:14px;overflow:hidden"><div style="{{progStyle}}"></div></div>
</div>
<nav class="tabs">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="16">
<a href="{{n.href}}" style="{{n.style}}"><span class="mono" style="{{n.numStyle}}"><sc-for list="{{n.num_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span><span><sc-for list="{{n.label_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span></a>
</sc-for>
</nav>
</aside>

<main class="main">

<header class="sheet" style="background-color:#C9A978;background-image:radial-gradient(rgba(255,255,255,0.08) 1px,transparent 1px);background-size:6px 6px;padding:44px 40px">
<div style="display:flex;flex-wrap:wrap;gap:32px;align-items:center">
<div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:18px">
<div class="card" style="background:#FBF7EE;transform:rotate(-1deg);padding:26px 28px">
<div class="mono" style="font-size:12px;text-transform:uppercase;color:#7A5230">IB Social and Cultural Anthropology · Production, Exchange and Consumption</div>
<h1 style="margin:10px 0 0;font-size:clamp(40px,6vw,72px);line-height:0.98">Fresh Fruit, <span style="color:#B3263E">Broken Bodies</span></h1>
<div style="font-size:20px;margin-top:10px">Migrant Farmworkers in the United States · Seth M. Holmes, 2013</div>
</div>
<p style="margin:0;font-size:19px;color:#2A2015;max-width:560px">An anthropologist and doctor follows Triqui farmworkers from the mountains of Oaxaca, across the Arizona desert, to the strawberry fields of Washington State. Open the notebook and follow the route.</p>
<div class="hand" style="font-size:28px;color:#5A1320">“we are field workers” (p. 30)</div>
</div>
<div style="flex:1 1 320px;min-width:0">
<svg viewBox="0 0 600 440" width="100%" role="img" aria-label="Sketch map of the migration route from San Miguel, Oaxaca, north across the border to California and Washington State" style="display:block;background:#F3EAD6;border:1.5px solid #8A6A3A;border-radius:4px">
<path d="M120 50 C 70 120, 70 170, 95 190 S 170 240, 200 265 S 240 300, 300 330 S 400 380, 440 395" fill="none" stroke="#B3263E" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"></path>
<path d="M150 236 L 330 236" stroke="#24211C" stroke-width="3" stroke-dasharray="14 6"></path>
<text x="335" y="241" font-family="IBM Plex Mono, monospace" font-size="15" fill="#24211C">la línea</text>
<g font-family="Caveat, cursive" font-size="24" fill="#24211C">
<circle cx="120" cy="50" r="9" fill="#2F6B3A"></circle><text x="138" y="57">Skagit Valley, WA</text>
<circle cx="95" cy="190" r="9" fill="#2F6B3A"></circle><text x="112" y="186">Madera, CA</text>
<circle cx="200" cy="265" r="9" fill="#D9A21B"></circle><text x="218" y="272">Altar, Sonora</text>
<circle cx="440" cy="395" r="11" fill="#B3263E"></circle><text x="300" y="428">San Miguel, Oaxaca</text>
</g>
<g transform="translate(470 70)"><path d="M0 0 C -26 -8, -34 26, 0 48 C 34 26, 26 -8, 0 0 Z" fill="#B3263E"></path><path d="M-12 -4 L 0 -16 L 12 -4" fill="none" stroke="#2F6B3A" stroke-width="5" stroke-linejoin="round"></path><circle cx="-8" cy="14" r="2" fill="#F3EAD6"></circle><circle cx="7" cy="20" r="2" fill="#F3EAD6"></circle><circle cx="-2" cy="30" r="2" fill="#F3EAD6"></circle></g>
<g transform="translate(250 330)" stroke="#2F6B3A" stroke-width="9" stroke-linecap="round" fill="none"><path d="M0 0 L 0 -70"></path><path d="M0 -30 L -18 -30 L -18 -52"></path><path d="M0 -40 L 16 -40 L 16 -60"></path></g>
</svg>
</div>
</div>
</header>

<section id="ch-puzzle" class="sheet">
<div class="mono" style="font-size:13px;text-transform:uppercase;color:#B3263E">1 · The puzzle</div>
<h2 style="margin:8px 0 12px;font-size:clamp(32px,4.6vw,54px);line-height:1.05">Is it worth risking your life?</h2>
<p style="margin:0 0 26px;max-width:760px">Every Saturday a bus of border crossers leaves Tlaxiaco. Most Triqui migrants earn a few thousand dollars a year, at the bottom of the farm. Why do they go, and why does almost nobody, including the pickers, question the system that breaks their bodies?</p>
<div class="grid3" style="margin-bottom:28px">
<sc-for list="{{puzzleStats}}" as="s" hint-placeholder-count="6">
<div class="card"><div class="slab" style="font-size:36px;line-height:1;color:#B3263E"><sc-for list="{{s.big_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div><div style="font-size:16px;margin-top:8px"><sc-for list="{{s.text_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div><div class="mono" style="font-size:12px;color:#7A5230;margin-top:8px"><sc-for list="{{s.ref_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div></div>
</sc-for>
</div>
<div class="card tape" style="background:#FFFDF6">
<div class="mono" style="font-size:12px;text-transform:uppercase;color:#7A5230;margin-bottom:12px">How you frame it changes the answer</div>
<div class="chips" style="margin-bottom:14px">
<sc-for list="{{frameChips}}" as="c" hint-placeholder-count="2"><button class="mono" type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}"><sc-for list="{{c.label_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button></sc-for>
</div>
<p style="margin:0;font-size:19px"><sc-for list="{{frameText_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></p>
</div>
</section>

<section id="ch-history" class="sheet">
<div class="mono" style="font-size:13px;text-transform:uppercase;color:#2E5A87">2 · Context</div>
<h2 style="margin:8px 0 12px;font-size:clamp(32px,4.6vw,54px);line-height:1.05">How did the system take shape?</h2>
<p style="margin:0 0 22px;max-width:760px">Conquest, labour law, trade agreements and border policy all shape who picks the berries, and on what terms.</p>
<div class="chips" style="margin-bottom:20px">
<sc-for list="{{tlChips}}" as="c" hint-placeholder-count="5"><button class="mono" type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}"><sc-for list="{{c.label_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button></sc-for>
</div>
<ol style="list-style:none;margin:0 0 34px;padding:0;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{timeline}}" as="e" hint-placeholder-count="8">
<li style="display:grid;grid-template-columns:minmax(92px,120px) minmax(0,1fr);gap:16px;align-items:start">
<div class="slab" style="font-size:20px;line-height:1.2;text-align:right"><sc-for list="{{e.year_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div>
<div style="{{e.style}}"><div style="font-size:17px"><sc-for list="{{e.text_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div><div class="mono" style="font-size:11px;text-transform:uppercase;margin-top:6px;opacity:0.85"><sc-for list="{{e.tagLabel_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div></div>
</li>
</sc-for>
</ol>
<h3 style="margin:0 0 6px;font-size:28px">Emic terms</h3>
<div class="grid3">
<sc-for list="{{glossary}}" as="g" hint-placeholder-count="8">
<button type="button" aria-expanded="{{g.expanded}}" onClick="{{g.toggle}}" style="{{g.style}}">
<span class="slab" style="display:block;font-size:21px"><em><sc-for list="{{g.term_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></em></span>
<sc-if value="{{g.open}}" hint-placeholder-val="{{ false }}"><span style="display:block;margin-top:6px;font-size:16px"><sc-for list="{{g.def_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span></sc-if>
<sc-if value="{{g.closed}}" hint-placeholder-val="{{ true }}"><span class="hand" style="display:block;margin-top:4px;font-size:20px;color:#7A5230">tap to check</span></sc-if>
</button>
</sc-for>
</div>
</section>

<section id="ch-route" class="sheet">
<div class="mono" style="font-size:13px;text-transform:uppercase;color:#B3263E">3 · The route</div>
<h2 style="margin:8px 0 12px;font-size:clamp(32px,4.6vw,54px);line-height:1.05">Where does the journey go?</h2>
<p style="margin:0 0 22px;max-width:760px">Holmes did “follow the people” fieldwork (p. 3). Pick a stop on the route, from the village to the farm.</p>
<div class="split">
<div class="mapbox">
<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" style="position:absolute;inset:0">
<polyline points="80,86 62,72 48,61 38,46 26,37 14,24 18,8" fill="none" stroke="#B3263E" stroke-width="0.8" stroke-dasharray="0.5 2.2" stroke-linecap="round"></polyline>
<line x1="0" y1="53" x2="100" y2="53" stroke="#24211C" stroke-width="0.6" stroke-dasharray="3 1.5"></line>
</svg>
<span class="mono" style="position:absolute;right:3%;top:47%;font-size:12px;color:#24211C">US ↑</span><span class="mono" style="position:absolute;right:3%;top:55%;font-size:12px;color:#24211C">Mexico ↓</span>
<sc-for list="{{stopPins}}" as="p" hint-placeholder-count="7"><button class="mono" type="button" aria-pressed="{{p.pressed}}" aria-label="{{p.name}}" onClick="{{p.pick}}" style="{{p.style}}"><sc-for list="{{p.n_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button></sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:14px">
<div class="chips">
<sc-for list="{{stopPins}}" as="p" hint-placeholder-count="7"><button class="mono" type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.chipStyle}}"><sc-for list="{{p.n_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for> <sc-for list="{{p.short_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></button></sc-for>
</div>
<div class="card tape">
<div class="mono" style="{{stop.tagStyle}}">Stop <sc-for list="{{stop.n_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for> · <sc-for list="{{stop.sub_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div>
<h3 style="margin:8px 0 8px;font-size:30px;line-height:1.1"><sc-for list="{{stop.name_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></h3>
<p style="margin:0 0 10px"><sc-for list="{{stop.text_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></p>
<div class="mono" style="font-size:13px;color:#7A5230">Key concepts: <sc-for list="{{stop.concept_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div>
</div>
<div class="hand" style="font-size:22px;color:#5A1320">“Macario tells me we are in Arizona now. I see no difference.” (p. 19)</div>
</div>
</div>
</section>

<section id="ch-farm" class="sheet">
<div class="mono" style="font-size:13px;text-transform:uppercase;color:#D9A21B">4 · The farm</div>
<h2 style="margin:8px 0 12px;font-size:clamp(32px,4.6vw,54px);line-height:1.05">Who does what on the Tanaka farm?</h2>
<p style="margin:0 0 22px;max-width:760px">Holmes drew the farm as a ladder (p. 51). Each rung has its own pay, housing, body position and worries, and ethnicity and citizenship decide who stands where. Bar length shows the number of workers.</p>
<div class="split">
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{rungs}}" as="r" hint-placeholder-count="7">
<button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="{{r.style}}"><span class="slab" style="font-size:17px"><sc-for list="{{r.name_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span><span class="mono" style="font-size:12px"><sc-for list="{{r.count_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span></button>
</sc-for>
<div class="mono" style="font-size:12px;color:#7A5230;margin-top:4px">Approximate numbers at peak season (p. 51)</div>
</div>
<div class="card tape">
<div class="mono" style="{{rung.tagStyle}}"><sc-for list="{{rung.body_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div>
<h3 style="margin:8px 0 12px;font-size:30px;line-height:1.1"><sc-for list="{{rung.name_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></h3>
<dl style="margin:0;display:grid;grid-template-columns:minmax(90px,120px) minmax(0,1fr);gap:8px 14px;font-size:17px">
<dt class="mono" style="font-size:12px;text-transform:uppercase;color:#7A5230;padding-top:4px">Who</dt><dd style="margin:0"><sc-for list="{{rung.who_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></dd>
<dt class="mono" style="font-size:12px;text-transform:uppercase;color:#7A5230;padding-top:4px">Time</dt><dd style="margin:0"><sc-for list="{{rung.time_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></dd>
<dt class="mono" style="font-size:12px;text-transform:uppercase;color:#7A5230;padding-top:4px">Housing</dt><dd style="margin:0"><sc-for list="{{rung.home_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></dd>
<dt class="mono" style="font-size:12px;text-transform:uppercase;color:#7A5230;padding-top:4px">Worries</dt><dd style="margin:0"><sc-for list="{{rung.worry_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></dd>
</dl>
<p class="hand" style="margin:16px 0 0;font-size:23px;line-height:1.25;color:#5A1320"><sc-for list="{{rung.quote_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></p>
</div>
</div>
<div class="grid2" style="margin-top:26px">
<div class="card" style="border-top:6px solid #B3263E"><div class="slab" style="font-size:22px">Conjugated oppression</div><p style="margin:8px 0 0;font-size:17px">Bourgois’ term: ethnicity and class “work together to produce an oppression experientially and materially different from that produced by either alone” (p. 50).</p></div>
<div class="card" style="border-top:6px solid #2E5A87"><div class="slab" style="font-size:22px">Holmes, out of place</div><p style="margin:8px 0 0;font-size:17px">He could never pick the minimum, yet kept his job and shack. Managers treated him “as a sort of jester” and asked his advice (p. 79).</p></div>
</div>
</section>

<section id="ch-berry" class="sheet">
<div class="mono" style="font-size:13px;text-transform:uppercase;color:#2F6B3A">5 · The berry</div>
<h2 style="margin:8px 0 12px;font-size:clamp(32px,4.6vw,54px);line-height:1.05">How does a strawberry reach your fridge?</h2>
<p style="margin:0 0 22px;max-width:760px">Follow the chain of production, exchange and consumption, from corn in Oaxaca to ice cream in the supermarket.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px;margin-bottom:16px">
<sc-for list="{{chainSteps}}" as="c" hint-placeholder-count="6"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}"><span class="mono" style="font-size:12px">Step <sc-for list="{{c.step_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span><span class="slab" style="display:block;font-size:18px;margin-top:4px"><sc-for list="{{c.name_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></span></button></sc-for>
</div>
<div class="card tape" style="margin-bottom:26px">
<div class="mono" style="font-size:12px;text-transform:uppercase;color:#2F6B3A">Step <sc-for list="{{chainStep.step_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for> · <sc-for list="{{chainStep.isc_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></div>
<h3 style="margin:8px 0 8px;font-size:28px"><sc-for list="{{chainStep.name_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></h3>
<p style="margin:0;font-size:19px"><sc-for list="{{chainStep.text_s}}" as="gq" hint-placeholder-count="1"><span style="{{gq.st}}">{{gq.t}}</span></sc-for></p>
</div>
<div class="grid2">
<div class="card" style="border-top:6px solid #2F6B3A">
<div class="slab" style="font-size:22px;margin-bottom:10px">Who pays for the worker?</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:16px">
<div style="background:#EFF5EC;padding:12px;border-radius:4px"><div class="mono" style="font-size:12px;text-transform:uppercase">Mexico provides</div>Childhood, education, health care, old age, recovery from sickness and injury</div>
<div style="background:#FBEDEE;padding:12px;border-radius:4px"><div class="mono" style="font-size:12px;text-transform:uppercase">The US provides</div>“only what is necessary while the migrants are working”</div>
</div>
<p style="margin:10px 0 0;font-size:15px">Burawoy’s analysis of migrant labour, extended by Holmes (pp. 12–13).</p>
</div>
<div class="card" style="border-top:6px solid #D9A21B">

<sc-if value="{{modelOpen}}" hint-placeholder-val="{{ false }}"><p style="margin:0;background:#FFF8E6;padding:14px 16px;border-radius:4px">An anthropological theory we can use to understand Fresh Fruit, Broken Bodies is practice theory. Pierre Bourdieu argues that our habitus and schemes of perception come from the social world, so we “misrecognize” its inequalities as natural, a process he calls symbolic violence (pp. 44, 157). Applied to the Tanaka farm, it explains why a crop manager says Oaxacans pick berries “because they’re lower to the ground”, and why Triqui pickers themselves say pesticides harm only delicate white bodies (pp. 171, 173): the hierarchy is hidden because it appears natural, written on the body. While practice theory explains why the hierarchy goes unquestioned, it can seem to leave little room for change, although Holmes argues that habitus changes when it meets a new field and points to the pickers’ strike as a glimpse of resistance (pp. 177, 184).</p></sc-if>

<script>
// Minimal standalone renderer for the study site template.
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) { Object.assign(this.state, patch); scheduleRender(); }
  }
  window.DCLogic = DCLogic;

  let comp = null, tpl = null, root = null, pending = false;

  function resolve(path, scope, vals) {
    path = path.trim();
    const parts = path.split('.');
    let cur;
    for (let i = scope.length - 1; i >= 0; i--) { if (Object.prototype.hasOwnProperty.call(scope[i], parts[0])) { cur = scope[i][parts[0]]; break; } }
    if (cur === undefined) cur = vals[parts[0]];
    for (let i = 1; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]]; }
    return cur;
  }
  const HOLE = /\{\{([^}]+)\}\}/g;
  function interp(str, scope, vals) {
    return str.replace(HOLE, (m, p) => { const v = resolve(p, scope, vals); return v == null ? '' : String(v); });
  }

  function build(node, scope, vals, out) {
    if (node.nodeType === 3) {
      const t = node.nodeValue;
      out.push(document.createTextNode(t.indexOf('{{') >= 0 ? interp(t, scope, vals) : t));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(node.getAttribute('list') || '');
      const list = m ? resolve(m[1], scope, vals) : null;
      const as = node.getAttribute('as');
      if (Array.isArray(list)) list.forEach((item) => { const s = scope.concat([{ [as]: item }]); node.childNodes.forEach((c) => build(c, s, vals, out)); });
      return;
    }
    if (tag === 'sc-if') {
      const m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(node.getAttribute('value') || '');

    }

      ? document.createElementNS(node.namespaceURI, node.tagName)
      : document.createElement(tag);

      }

      el.setAttribute(a.name, v.indexOf('{{') >= 0 ? interp(v, scope, vals) : v);
    }

    node.childNodes.forEach((c) => build(c, scope, vals, kids));
